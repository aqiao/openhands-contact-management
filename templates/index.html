{% extends "base.html" %}

{% block content %}
<h1>Contact Management</h1>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for contact in contacts %}
        <tr>
            <td>{{ contact.name }}</td>
            <td>{{ contact.phone }}</td>
            <td>{{ contact.email }}</td>
            <td>
                <a href="{{ url_for('edit_contact', id=contact.id) }}" class="btn btn-sm btn-primary">Edit</a>
                <button class="btn btn-sm btn-danger" data-bs-toggle="modal" data-bs-target="#deleteModal{{ contact.id }}">Delete</button>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteModal{{ contact.id }}" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirm Delete</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        Are you sure you want to delete {{ contact.name }}?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <a href="{{ url_for('delete_contact', id=contact.id) }}" class="btn btn-danger">Delete</a>
      </div>
    </div>
  </div>
</div>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<a href="{{ url_for('add_contact') }}" class="btn btn-success">Add Contact</a>
{% endblock %}
